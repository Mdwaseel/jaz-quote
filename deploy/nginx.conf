# JAZ — Nginx site config.
# Copy to /etc/nginx/sites-available/jaz, symlink into sites-enabled,
# adjust server_name + root, then `nginx -t && systemctl reload nginx`.
# Add TLS with:  certbot --nginx -d your-domain.com -d www.your-domain.com

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Built React frontend (frontend/dist copied/served here)
    root /var/www/jaz/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # --- Django API + admin + files (proxied to Gunicorn) ---
    location /api/    { proxy_pass http://127.0.0.1:8001; include /etc/nginx/proxy_params; }
    location /media/  { proxy_pass http://127.0.0.1:8001; include /etc/nginx/proxy_params; }
    location /static/ { proxy_pass http://127.0.0.1:8001; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://127.0.0.1:8001; include /etc/nginx/proxy_params; }

    # --- React SPA (client-side routing) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed frontend assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
