# In-container nginx: serves the built SPA and proxies API/media/admin to the
# Django backend container. Fronted by the host's nginx (TLS terminated there).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Host nginx passes X-Forwarded-Proto=https; default to $scheme if absent.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/    { proxy_pass http://backend:8000; }
    location /media/  { proxy_pass http://backend:8000; }
    location /static/ { proxy_pass http://backend:8000; }
    # NB: /admin/* is the React admin panel (client-side route), so it is NOT
    # proxied — it falls through to the SPA below. Django's own admin is not
    # exposed publicly (the React panel supersedes it).

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
